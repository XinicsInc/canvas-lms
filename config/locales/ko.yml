  new_sis_integrations: '이 기능은 기존 SIS Canvas 통합이있는 기관에 적용됩니다.

    Canvas에서 현재 등급 패스 백 솔루션을 사용중인 모든 고객 또는

    파트너 제품은 향상된 할당 데이터를 위해이 기능을 활성화해야합니다.

    검증 워크 플로우. 활성화되면이 기능은 새로운 SIS를 표시합니다.

    계정의 SIS 동기화 (과제 수준 성적 패스 백)에 대한 통합 설정

    설정. SIS에 게시 기능 옵션이이 새로운 기능에 통합되었습니다.

    기본적으로 활성화됩니다.'
