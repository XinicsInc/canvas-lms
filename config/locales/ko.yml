      buttons:
        add_eportfolio: e-포트폴리오 만들기
      defaults:
        eportfolio_name: 내 포트폴리오
      headers:
        add_eportfolio: e-포트폴리오 만들기
        eportfolios: ePortfolios
        my_eportfolios: 내 ePortfolios
        what: ePortfolio가 무엇입니까?
      labels:
        eportfolio_name: ePortfolio 이름
        make_public: 공개하기
      links:
        create: e-포트폴리오 만들기
      page_title: 내 ePortfolio
      what:
        details1: 'e-포트폴리오는 중요한 제출물과 학습 과정에서 겪은 경험에 대해

          표시하고 토론하는 곳입니다. ePortfolio는 다음과 같은 일을 위해

          사용할 수 있습니다:


          * 교수만 보기에는 자랑스러운 보고서를 표시

          * 학급 제출물에 들어간 모든 생각과 작업에 대한 이야기

          * 전체적인 학습 경험에 대한 개요를 수집

          * 급우나 미래의 상사와 작업을 공유


          ePortfolios는 모든 사람이 볼 수 있도록 공개할 수도 있고

          허용한 사람만 볼 수 있도록 비공개로 할 수 있으며, 언제든지

          이 설정을 변경할 수 있습니다.


          시작할 준비가 되셨습니까? 버튼을 클릭하십시오.'
    wizard_box:
      finish:
        body: 시작할 준비가 되셨습니까? 어떤 페이지에서든지 "%{help_link_text}" 링크를 클릭하면 이 마법사 페이지로 돌아올
          수 있습니다.
      headers:
        finish: 시작합시다
        getting_started: 시작하기
        instructions: ePortfolio 사용하기
        introduction: 소개
        page_content: 페이지 내용
        pages: 섹션 페이지
        sections: 포트폴리오 섹션
        settings: ePortfolio 설정
        submissions: 제출물 추가
      introduction:
        body: ePortfolios는 여러분의 작업을 보여주는 장소입니다. 이는 섹션과 페이지로 구성되어 있습니다. 섹션의 목록은 창 왼쪽에
          있습니다(%{showme1}). 각 섹션은 여러 개의 페이지를 가질 수 있으며 오른쪽 창에 표시됩니다(%{showme2}).
      links:
        portfolio: 포트폴리오 보기
      page_content:
        body1: 페이지에서 보는 내용은 다른 방문자가 보는 것과 같은 내용입니다. 내용 편집을 위해서 "%{edit_link_text}"
          링크(%{showme})를 클릭하면 페이지가 편집 모드로 바뀝니다.
        body2: 이제 편집 중입니다! 원한다면 페이지 이름을 바꾸거나 의견 달기 옵션을 변경하십시오(%{showme1}). 오른쪽에 있는
          버튼을 클릭하면 언제든지 변경 사항을 저장하고, 미리 보고, 취소할 수 있습니다(%{showme2}).
        body3: 내용은 테두리가 점선으로 된 하위 섹션으로 나누어집니다. 하위 섹션의 오른쪽 위에 있는 %{edit_icon} 아이콘이나
          %{delete_icon} 아이콘을 클릭하면 하위 섹션의 내용을 편집하거나 삭제할 수 있습니다.
        body4: 새 하위 섹션을 추가하려면 페이지 오른쪽에 있는 옵션 목록에서 추가하려는 내용 유형을 찾아 클릭하십시오(%{showme}).
      pages:
        body1: 섹션은 여러 개의 페이지를 가지고 있습니다. 창 오른쪽에서 현재 섹션의 페이지 목록을 볼 수 있습니다(%{showme1}).
          페이지를 구성하거나 추가하려면 "%{manage_pages}" 링크를 클릭하십시오(%{showme2}).
        body2: '%{edit_icon} 아이콘을 클릭하면 페이지 이름을 바꿀 수 있고 %{delete_icon} 아이콘을 클릭하면 페이지를
          삭제할 수 있으며, 클릭해서 끌어다 놓으면 페이지 순서를 바꿀 수 있습니다.'
      sections:
        body1: 섹션은 창 왼쪽에 나열됩니다(%{showme1}). 각 섹션은 안에 여러 개의 페이지를 가질 수 있습니다. 섹션을 구성하거나
          추가하려면 "%{manage_sections}" 링크를 클릭하십시오(%{showme2}).
        body2: '%{edit_icon} 아이콘을 클릭하면 페이지 이름을 바꿀 수 있고 클릭해서 끌어다 놓으면 페이지 순서를 바꿀 수 있으며
          %{delete_icon} 아이콘을 클릭하면 페이지를 삭제할 수 있습니다. '
      settings:
        body: 여러분의 ePortfolio 설정을 바꾸려면 "ePortfolio 설정" 링크를 클릭하십시오(%{showme}). 포트폴리오
          이름을 바꿀 수 있고 공개인지 비공개인지 바꿀 수도 있습니다. 비공개 포트폴리오는 액세스를 허용한 사람만 볼 수 있습니다.
      submissions:
        body1: 이 페이지의 아래는 과목의 최근 제출물 목록이라는 것을 알 수 있습니다(%{showme}). 이 페이지에서 포트폴리오에
          있는 페이지에 신속하게 제출물을 추가할 수 있습니다. 추가하려는 제출물을 클릭하면 간단한 대화 상자가 나타납니다.
        body2: 좋습니다! 이제 제출물 추가를 마쳤으므로 어떤 섹션에 추가할 것인지 선택하고 페이지에 이름을 붙여야 합니다. "페이지 추가"를
          클릭하고 나면 새 페이지로 이동하는데 원하는 경우에 상세 정보를 편집할 수 있습니다.
