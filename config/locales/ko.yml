    grade_export:
      description: SIS를 위한 성적 내보내기
      name: 성적 내보내기
    grade_export_settings:
      description: '이 플러그인을 사용하면 최종 성적을 학생 정보 시스템 (SIS)에 다시 게시 할 수 있습니다. 활성화되면 사용자에게
        성적 기록에 이러한 성적을 게시 할 수있는 옵션이 제공됩니다. 이는 지정된 게시 엔드 포인트에 대한 POST 요청을 통해 발생합니다.
        각 유형은 자체 콘텐츠 형식과 MIME 유형을 정의합니다. 엔드 포인트의 응답은 중요하지 않으며 현재 무시됩니다.


        예를 들어 Instructure 형식의 CSV는 다음 열을 포함하는 MIME 유형 ''text / csv''를 사용하여 csv 파일을
        지정된 엔드 포인트에 게시합니다.


        "publisher_id", "publisher_sis_id", "course_id", "course_sis_id", "section_id",
        "section_sis_id", "student_id", "student_sis_id", "enrollment_id", "enrollment_status",
        "score", "grade"


        (참고 : "성적"열은 과목이 채점 기준을 지정하는 경우에만 반환됩니다.)


        공개되는 과목의 각 학생에 대해 게시 된 csv에 1 개 이상의 행이 있습니다. 특히, 학생이 과목의 루트 계정에있는 각 로그인에 대해
        1 개의 행이 있습니다. 대부분의 경우 학생당 1 개의 행이 생성되지만 학생이 여러 번 로그인 한 경우 각 행이 표시됩니다.


        "최종 성적 재정의 포함"이 선택되어 있고 최종 성적 재정의 기능이 활성화 된 경우 재정의 성적 / 점수가있는 학생은 계산 된 점수
        및 성적 대신이를 받게됩니다.'
      labels:
        format_type: 출력 형식 유형
        include_final_grade_overrides: 최종 성적 재정의 포함
        publish_endpoint: 공개할 끝점
        success_timeout: 성공 알림 시간 제한(초)
        wait_for_success: 성공 알림 대기
