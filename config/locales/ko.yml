        document_name: 문서 이름
      messages:
        delete_google_doc_as_well: 이 협업은 Google Doc으로 저장됩니다. Canvas에서만 삭제하시겠습니까, Google
          Docs에서도 제거하시겠습니까?
      titles:
        new: 새 협업 시작
    google_drive:
      file_not_found: 공동 작업 파일을 찾을 수 없습니다.
    index:
      description_student: '** 공동 작업이란 무엇을 의미합니까? ** 우리는 웹 기반 도구에 대해 이야기하고 있습니다.

        공유 문서에서 함께 작업합니다. 다음과 같은 리소스를 사용할 수 있습니다.

        [Google 문서 도구] (%{google_url})

        그룹 문서 또는 메모 작성과 같은 작업을 공동으로 작업합니다. 이 페이지는

        이러한 협업을 추적하고 설정할 수있는 쉬운 장소

        이메일을 교환하지 않아도됩니다.'
      description_teacher: '** 공동 작업이란 무엇을 의미합니까? ** 우리는 웹 기반 도구에 대해 이야기하고 있습니다.

        학생들은 이미 익숙 할 것입니다. 학생들은 다음과 같은 리소스를 사용할 수 있습니다.

