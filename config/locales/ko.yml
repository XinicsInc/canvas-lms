      descriptions:
        etherpad: 'EtherPad는 신속하게 공유 문서를 설정할 수 있는 오픈 소스 프로젝트입니다. 이는 다른 사람이 입력하는 동안에
          무엇을 입력하는 지 볼 수 있을 정도로 충분히 빠릅니다. 반면 "패드"가 암호로 보호되지 않아서 링크를 가진 누구나 편집할 수 있습니다.
          EtherPad는 익명성을 보장하고 Google 계정이 없어도 참여할 수 있도록 하려면 Google Docs보다 적합합니다.


          **주의**: 여러분의 작업을 확실하게 보존하려면 [EtherPad 삭제 정책](%{etherpad_deletion_policy_url})을
          숙지해야 합니다.'
        google_docs: "Google Docs는 그룹 프로젝트에서 협업하기에 좋은 곳입니다. Microsoft Word와 같으면서도\
          \ 이메일을 주고 받지 않고 다른 사람들과 동시에 작업을 할 수 있게 해줍니다.  \n  \n**주의**: Google Docs\
          \ 협업에 참여하려면 여러분과 협업자 모두 Google 계정이 필요합니다."
